<button
	*ngIf="isPublicRoute()"
	type="button"
	class="sb-theme-toggle"
	(click)="toggleTheme()"
	[attr.aria-label]="theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode'"
	[attr.title]="theme === 'light' ? 'Dark mode' : 'Light mode'"
>
	<svg *ngIf="theme === 'dark'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
		<circle cx="12" cy="12" r="4"></circle>
		<path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
	</svg>
	<svg *ngIf="theme === 'light'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
		<path d="M21 12.79A9 9 0 1 1 11.21 3c.5 0 .78.56.52.99A7 7 0 0 0 20.01 13.27c.43-.26.99.02.99.52z"></path>
	</svg>
</button>

<router-outlet></router-outlet>

<app-chatbot></app-chatbot>
