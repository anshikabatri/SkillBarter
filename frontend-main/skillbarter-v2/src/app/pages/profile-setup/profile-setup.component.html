<div class="setup-page">
  <div class="glow"></div>
  <div class="setup-card">
    <div class="brand">SkillBarter</div>
    <h1>Set Up Your Profile</h1>
    <p class="sub">Just add your basic profile details</p>
    <div class="form-group"><label>Your Name</label><input type="text" [(ngModel)]="form.name" class="input" placeholder="Full name" required minlength="2" maxlength="80" pattern="[A-Za-z][A-Za-z\s.'-]{1,79}"></div>
    <div class="form-group"><label>About You</label><textarea [(ngModel)]="form.bio" class="input ta" placeholder="Tell others what you're about..." maxlength="500"></textarea></div>
    <div class="error-box" *ngIf="error">{{ error }}</div>
    <button class="btn-primary w100" (click)="save()" [disabled]="loading || !form.name.trim()">{{ loading ? 'Saving...' : 'Continue to Dashboard →' }}</button>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn-secondary" style="flex:1" (click)="resetForm()" [disabled]="loading">Reset</button>
      <button class="btn-ghost" style="flex:1" (click)="cancelForm()" [disabled]="loading">Cancel</button>
    </div>
  </div>
</div>
