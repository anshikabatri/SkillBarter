<div class="auth-page">
  <div class="glow"></div>
  <div class="auth-card">
    <div class="brand">SkillBarter</div>
    <h1>Create account</h1>
    <p class="sub">Join thousands exchanging skills globally</p>
    <div class="form-group"><label>Full Name</label><input type="text" [(ngModel)]="name" class="input" placeholder="Your full name" required minlength="2" maxlength="80" pattern="[A-Za-z][A-Za-z\s.'-]{1,79}"></div>
    <div class="form-group"><label>Email</label><input type="email" [(ngModel)]="email" class="input" placeholder="you@domain.com" required maxlength="120"></div>
    <div class="form-group"><label>Password</label><input type="password" [(ngModel)]="password" class="input" placeholder="Min 6 characters" required minlength="6" maxlength="128"></div>
    <div class="form-group"><label>Confirm Password</label><input type="password" [(ngModel)]="confirmPassword" class="input" placeholder="Repeat password" required minlength="6" maxlength="128"></div>
    <div class="form-group">
      <label>Languages (hold Ctrl to select multiple)</label>
      <select [(ngModel)]="languages" class="input" multiple size="4">
        <option *ngFor="let l of langs" [value]="l">{{ l }}</option>
      </select>
    </div>
    <div class="form-group">
      <label>Skills I Have (select from platform skills)</label>
      <select [(ngModel)]="teachSkillIds" class="input" multiple size="5" [disabled]="skillsLoading">
        <option *ngFor="let s of availableSkills" [value]="s.skillId">{{ s.name }}</option>
      </select>
    </div>
    <div class="form-group">
      <label>Skills I Need to Learn (select from platform skills)</label>
      <select [(ngModel)]="learnSkillIds" class="input" multiple size="5" [disabled]="skillsLoading">
        <option *ngFor="let s of availableSkills" [value]="s.skillId">{{ s.name }}</option>
      </select>
    </div>
    <div class="sub" *ngIf="skillsLoading" style="margin-bottom:12px;">Loading skills...</div>
    <div class="error-box" *ngIf="error">{{ error }}</div>
    <button class="btn-primary w100" (click)="signup()" [disabled]="loading || !name.trim() || !email.trim() || !password || !confirmPassword">{{ loading ? 'Creating account...' : 'Create Account' }}</button>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn-secondary" style="flex:1" (click)="resetForm()" [disabled]="loading">Reset</button>
      <button class="btn-ghost" style="flex:1" (click)="cancelForm()" [disabled]="loading">Cancel</button>
    </div>
    <p class="switch">Already have an account? <a routerLink="/login">Sign In</a></p>
  </div>
</div>
