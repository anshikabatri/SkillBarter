<div class="auth-page">
  <div class="glow"></div>
  <div class="auth-card">
    <div class="brand">SkillBarter</div>
    <h1>Reset your password</h1>
    <p class="sub">Generate a reset token and set a new password.</p>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" class="input" placeholder="you@domain.com" required maxlength="120">
    </div>

    <button class="btn-primary w100" (click)="generateToken()" [disabled]="loadingToken || !email.trim()">
      {{ loadingToken ? 'Generating...' : 'Generate Reset Token' }}
    </button>

    <div class="form-group" style="margin-top:12px;">
      <label>Reset Token</label>
      <input type="text" [(ngModel)]="token" class="input" placeholder="Paste token" required minlength="6" maxlength="256">
    </div>

    <div class="form-group">
      <label>New Password</label>
      <input type="password" [(ngModel)]="newPassword" class="input" placeholder="Minimum 6 characters" required minlength="6" maxlength="128">
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" [(ngModel)]="confirmPassword" class="input" placeholder="Repeat password" required minlength="6" maxlength="128">
    </div>

    <div class="success-box" *ngIf="success">{{ success }}</div>
    <div class="error-box" *ngIf="error">{{ error }}</div>

    <button class="btn-primary w100" (click)="resetPassword()" [disabled]="loadingReset || !token.trim() || !newPassword || !confirmPassword">
      {{ loadingReset ? 'Resetting...' : 'Reset Password' }}
    </button>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn-secondary" style="flex:1" (click)="resetForm()" [disabled]="loadingToken || loadingReset">Reset</button>
      <button class="btn-ghost" style="flex:1" (click)="cancelForm()" [disabled]="loadingToken || loadingReset">Cancel</button>
    </div>

    <p class="switch">Back to <a routerLink="/login">Sign In</a></p>
  </div>
</div>
