<div class="sb-chatbot" [class.open]="isOpen">
  <button class="sb-toggle" (click)="toggle()" aria-label="Toggle chat">
    <span *ngIf="!isOpen">💬</span>
    <span *ngIf="isOpen">✕</span>
  </button>

  <div class="sb-window" *ngIf="isOpen">
    <div class="sb-header">
      <div class="sb-title">{{ assistantName }}</div>
    </div>

    <div class="sb-body">
      <div class="sb-messages">
        <div *ngFor="let m of messages" [ngClass]="{'bot': m.from === 'bot', 'user': m.from === 'user'}" class="sb-message" [class.loading]="m.loading">
          <span *ngIf="!m.loading">{{ m.text }}</span>
          <span *ngIf="m.loading" class="typing-indicator">
            <span></span><span></span><span></span>
          </span>
        </div>
      </div>

      <div class="sb-quick">{{ quickLabel }}</div>
      <div class="sb-quick-list">
        <button *ngFor="let q of cannedQuestions" class="sb-quick-btn" (click)="chooseQuestion(q)" [disabled]="isAiLoading">{{ q }}</button>
      </div>
    </div>

    <div class="sb-input">
      <input type="text" [placeholder]="placeholder" [(ngModel)]="userInput" [maxlength]="maxInputLength" (keyup.enter)="sendUserInput()" [disabled]="isAiLoading" />
      <button (click)="sendUserInput()" [disabled]="!userInput.trim() || isAiLoading">{{ sendLabel }}</button>
    </div>
  </div>
</div>
